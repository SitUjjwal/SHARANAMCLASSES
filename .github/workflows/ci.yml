# Continuous Integration — lint, test, build on every PR / push.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@sharanam/shared

      - name: Lint (API · Admin · Shared)
        run: |
          npm run lint --workspace=@sharanam/api
          npm run lint --workspace=@sharanam/admin
          npm run lint --workspace=@sharanam/shared --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (API)
        run: npm run test --workspace=@sharanam/api

      - name: Build API + Admin
        run: |
          npm run build --workspace=@sharanam/api
          npm run build --workspace=@sharanam/admin
        env:
          VITE_API_BASE_URL: http://localhost:4000
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: public-anon-placeholder
          VITE_RAZORPAY_KEY_ID: rzp_test_placeholder

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: lint-test-build
    timeout-minutes: 30
    # PRs + pushes: prove images build; push happens in deploy.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: sharanam-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: sharanam-admin:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:4000
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_ANON_KEY=public-anon-placeholder
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
