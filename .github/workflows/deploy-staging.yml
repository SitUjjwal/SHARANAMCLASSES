# Build & push STAGING images to GHCR, optionally deploy over SSH.
# Trigger: push to `develop`, or manual workflow_dispatch.
name: Deploy Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Only build/push images (skip remote SSH deploy)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push staging images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image names
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo '${{ github.sha }}' | cut -c1-7)
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "version=staging-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/sharanam-api:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/sharanam-api:staging
          cache-from: type=gha,scope=api-staging
          cache-to: type=gha,mode=max,scope=api-staging

      - name: Build & push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/sharanam-admin:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/sharanam-admin:staging
          build-args: |
            VITE_API_BASE_URL=${{ secrets.STAGING_VITE_API_BASE_URL }}
            VITE_SUPABASE_URL=${{ secrets.STAGING_VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.STAGING_VITE_SUPABASE_ANON_KEY }}
            VITE_RAZORPAY_KEY_ID=${{ secrets.STAGING_VITE_RAZORPAY_KEY_ID }}
          cache-from: type=gha,scope=admin-staging
          cache-to: type=gha,mode=max,scope=admin-staging

  deploy:
    name: Deploy staging over SSH
    runs-on: ubuntu-latest
    needs: build-push
    if: |
      (github.event_name == 'push' && vars.STAGING_DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_deploy != 'true')
    timeout-minutes: 20

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          OWNER: ${{ needs.build-push.outputs.owner }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,IMAGE_TAG,OWNER,ACTOR
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            export IMAGE_TAG
            export GITHUB_REPOSITORY_OWNER="$OWNER"
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f
            sleep 3
            curl -fsS "http://127.0.0.1:4000/ready" || true
            docker compose -f docker-compose.staging.yml ps
