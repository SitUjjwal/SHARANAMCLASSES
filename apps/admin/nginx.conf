# Admin SPA nginx — production static hosting
# Gzip, long-cache hashed assets, no-cache HTML, error pages, security headers.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hide nginx version
  server_tokens off;

  # Container / LB probe
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # SEO: private admin — do not index
  location = /robots.txt {
    add_header Content-Type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Hashed Vite bundles — immutable long cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
    try_files $uri =404;
  }

  # Static images / icons — medium cache
  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # SPA entry — never cache HTML so deploys take effect immediately
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }

  # Static error pages (nginx-level failures)
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    internal;
    add_header Cache-Control "no-cache" always;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-XSS-Protection "0" always;
}
