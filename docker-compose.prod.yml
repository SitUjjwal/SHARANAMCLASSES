# SHARANAM CLASSES — PRODUCTION (API + Admin + HTTPS via Caddy)
#
# Prerequisites:
#   1. DNS A/AAAA for API_DOMAIN and ADMIN_DOMAIN → this server
#   2. Ports 80 + 443 open (firewall / security group)
#   3. apps/api/.env from .env.production.example (LIVE secrets)
#   4. Root .env from .env.backend.example (domains + ACME_EMAIL)
#   5. Images: build or pull from GHCR
#
#   cp apps/api/.env.production.example apps/api/.env
#   cp .env.backend.example .env
#   export IMAGE_TAG=<sha7>
#   export GITHUB_REPOSITORY_OWNER=<lowercase-owner>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Backend-only (no admin): docker-compose.backend.yml
#
# Probes:
#   curl -fsS https://$API_DOMAIN/health
#   curl -fsS https://$API_DOMAIN/ready

name: sharanam-prod

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-sharanam}/sharanam-api:${IMAGE_TAG:-latest}
    container_name: sharanam-api-prod
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "4000"
    # Loopback only — public traffic goes through Caddy :443
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: "4000"
      LOG_DIR: /app/logs
      LOG_TO_CONSOLE: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-15000}
    volumes:
      - api_logs_prod:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - sharanam

  admin:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-sharanam}/sharanam-admin:${IMAGE_TAG:-latest}
    container_name: sharanam-admin-prod
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sharanam

  caddy:
    image: caddy:2.9-alpine
    container_name: sharanam-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
    networks:
      - sharanam

networks:
  sharanam:
    driver: bridge

volumes:
  api_logs_prod:
    name: sharanam-api-logs-prod
  caddy_data:
    name: sharanam-caddy-data
  caddy_config:
    name: sharanam-caddy-config
