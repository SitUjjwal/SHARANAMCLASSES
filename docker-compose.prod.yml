# Production compose — pulls pre-built images from GHCR (set by CI deploy).
# Usage on server:
#   export IMAGE_TAG=main   # or git sha
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

name: sharanam-classes

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-sharanam}/sharanam-api:${IMAGE_TAG:-latest}
    container_name: sharanam-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      LOG_DIR: /app/logs
      LOG_TO_CONSOLE: "true"
    volumes:
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - sharanam

  admin:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-sharanam}/sharanam-admin:${IMAGE_TAG:-latest}
    container_name: sharanam-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sharanam

networks:
  sharanam:
    driver: bridge

volumes:
  api_logs:
    name: sharanam-api-logs
