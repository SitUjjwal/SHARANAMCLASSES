# SHARANAM CLASSES — DEVELOPMENT compose (local Docker)
# Usage:
#   cp .env.docker.example .env          # VITE_* for admin image
#   cp apps/api/.env.example apps/api/.env
#   docker compose -f docker-compose.yml up --build -d
#
# Prefer npm workspaces for day-to-day coding:
#   npm run dev:api   /   npm run dev:admin

name: sharanam-dev

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_VERSION: "22"
    image: sharanam-api:dev
    container_name: sharanam-api-dev
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${API_PORT:-4000}:4000"
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: development
      APP_ENV: development
      PORT: "4000"
      LOG_DIR: /app/logs
      LOG_TO_CONSOLE: "true"
      LOG_LEVEL: debug
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
    volumes:
      - api_logs_dev:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - sharanam

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NODE_VERSION: "22"
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID:-}
    image: sharanam-admin:dev
    container_name: sharanam-admin-dev
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - sharanam

networks:
  sharanam:
    driver: bridge

volumes:
  api_logs_dev:
    name: sharanam-api-logs-dev
